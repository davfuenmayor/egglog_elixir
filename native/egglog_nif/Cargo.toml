[package]
name = "egglog_nif"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
egglog = { path = "vendor/egglog", default-features = false, features = ["graphviz", "serde"] }
rustler = "0.38.0"
serde_json = "1.0"

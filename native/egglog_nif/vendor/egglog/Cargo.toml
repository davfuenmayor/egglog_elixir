# Library-only copy of egglog at the revision recorded in README.md.
[package]
name = "egglog"
version = "3.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/egraphs-good/egglog"
publish = false
autobins = false

[package.metadata]
upstream = "https://github.com/egraphs-good/egglog/commit/d89bc58adc9b9a87a8f571c5b9ad75d686d226e6"

[features]
default = []
serde = ["egraph-serialize/serde"]
graphviz = ["egraph-serialize/graphviz"]

[dependencies]
egraph-serialize = { version = "0.3.0", default-features = false }
hashbrown = "0.16"
im-rc = "15.1.0"
indexmap = "2.2"
itoa = "1.0"
log = "0.4"
num = "0.4.3"
ordered-float = "5.0"
rustc-hash = "2.1"
smallvec = "1.10"
thiserror = "2.0"
web-time = "1.1"
dyn-clone = "1.0.17"
enum-map = "2.7"
csv = "1.3"
egglog-core-relations = { git = "https://github.com/egraphs-good/egglog.git", rev = "d89bc58adc9b9a87a8f571c5b9ad75d686d226e6" }
egglog-ast = { git = "https://github.com/egraphs-good/egglog.git", rev = "d89bc58adc9b9a87a8f571c5b9ad75d686d226e6" }
egglog-bridge = { git = "https://github.com/egraphs-good/egglog.git", rev = "d89bc58adc9b9a87a8f571c5b9ad75d686d226e6" }
egglog-numeric-id = { git = "https://github.com/egraphs-good/egglog.git", rev = "d89bc58adc9b9a87a8f571c5b9ad75d686d226e6" }
egglog-add-primitive = { git = "https://github.com/egraphs-good/egglog.git", rev = "d89bc58adc9b9a87a8f571c5b9ad75d686d226e6" }
egglog-reports = { git = "https://github.com/egraphs-good/egglog.git", rev = "d89bc58adc9b9a87a8f571c5b9ad75d686d226e6" }
serde_json = "1.0"
